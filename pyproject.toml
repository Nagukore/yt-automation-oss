[project]
name = "yt-automation"
version = "0.1.0"
description = "AI-powered YouTube automation system (human-in-the-loop)"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    # config / env
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    # db
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    # auth
    "bcrypt>=4.1",
    "pyjwt>=2.10",
    # queue / schedule
    "celery>=5.4",
    "redis>=5.2",
    "apscheduler>=3.10",
    # llm / pipeline
    "langgraph>=0.2.60",
    "httpx>=0.27",
    "tenacity>=9.0",
    # trends
    "pytrends>=4.9",
    # tts — default provider: free, keyless, cross-platform, ships subtitle timings
    "edge-tts>=7.0",
    # youtube publishing
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    # media (heavy / optional installs handled in extras but imported lazily)
    "moviepy>=1.0.3,<2.0",
    # ships a working ffmpeg binary, so rendering + subtitle burn-in need no system install
    "imageio-ffmpeg>=0.5",
    "numpy>=1.26",
    "pillow>=10.4",
    # logging
    "loguru>=0.7",
]

[project.optional-dependencies]
# Heavy / hardware-dependent providers. Install only what you enable.
media = [
    "faster-whisper>=1.0",
    "piper-tts>=1.2; platform_system != 'Windows'",
    "elevenlabs>=1.9",
    "diffusers>=0.31",
    "torch>=2.2",
    "openai>=1.54",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults
