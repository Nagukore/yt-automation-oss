# Full 24/7 stack: db, redis, api, celery worker, celery beat (scheduler), frontend.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yt}
      POSTGRES_DB: ${POSTGRES_DB:-yt_automation}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yt}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    volumes:
      - media:/app/media_output
      - ./secrets:/app/secrets
    ports:
      - "8000:8000"
    # Run migrations then start the API.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --app-dir backend"
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    volumes:
      - media:/app/media_output
      - ./secrets:/app/secrets
    command: celery -A app.core.celery_app.celery worker -l info --concurrency=2
    restart: unless-stopped

  beat:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis: { condition: service_started }
    command: celery -A app.core.celery_app.celery beat -l info
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  pgdata:
  media:
