name: Weekly Performance Stats

# Closes the feedback loop: fetches public view/like/comment counts for every
# video in state/published.json and commits state/performance.json (which biases
# humor-theme rotation toward what performs) + a readable markdown report.
#
# Needs the YOUTUBE_API_KEY secret: a plain Google API key with YouTube Data API
# v3 enabled (Google Cloud Console -> Credentials -> Create credentials -> API key).
# No OAuth — public statistics only.

on:
  # --- SCHEDULES PAUSED ---------------------------------------------------
  # Cron triggers are commented out while this repo is public and idle, so no
  # scheduled runs burn Actions minutes or API quota. `workflow_dispatch`
  # below is left active: it only fires when someone clicks Run workflow.
  # To resume, uncomment the `schedule:` key and its `- cron:` line.
  # schedule:
  #   # Monday 03:50 UTC, before the day's uploads, so the week starts with
  #   # fresh weights.
  #   # The :50 buys back the queue delay GitHub adds on the hour — see daily-video.yml.
  #   - cron: "50 3 * * 1"
  workflow_dispatch:

concurrency:
  group: weekly-stats
  cancel-in-progress: false

permissions:
  contents: write        # commit state/performance.json + report back
  issues: write          # file a failure issue (see "Open an issue on failure")

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # View/like counts are public and need only the API key, but the country
      # breakdown is owner-only data from the YouTube Analytics API, which needs
      # OAuth. If the token predates the yt-analytics.readonly scope the run still
      # succeeds — it just logs how to re-authorize and skips geography.
      - name: Restore YouTube OAuth token
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          mkdir -p secrets
          printf '%s' "$YOUTUBE_TOKEN_JSON" > secrets/youtube_token.json
          python -c "import json;json.load(open('secrets/youtube_token.json'));print('token ok')"

      - name: Collect stats
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DATABASE_URL: sqlite:///./run.db
          JWT_SECRET_KEY: ci-not-used
          LOG_LEVEL: INFO
        run: python scripts/collect_stats.py

      - name: Commit performance data
        run: |
          if [[ -n "$(git status --porcelain state/)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/performance.json state/performance_report.md
            git commit -m "chore: weekly performance stats [skip ci]"
            git push
          else
            echo "no stat changes to record"
          fi

      # This one fails quietly in a different way: theme rotation keeps running on
      # stale weights, so content slowly drifts off what the audience rewards without
      # anything looking broken. See daily-video.yml.
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="${{ github.workflow }} failed"
          body="Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Stats were not collected, so theme weights are running stale."
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty') || true
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body" || echo "could not comment on issue #$existing"
          else
            gh issue create --title "$title" --body "$body" || echo "could not create issue — are Issues enabled on this repo?"
          fi
