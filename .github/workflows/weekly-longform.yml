name: Weekly Long-Form Video

# Long-form (4-6 min, 16:9) videos on US trending news, twice a week.
# Topics come from Google Trends US, grounded in the real news headline the
# feed attaches to each trend so the script has facts to work from. Long-form
# is where watch-time revenue lives; Shorts feed discovery.
#
# Geo is US, not IN, deliberately: YouTube pays on where the VIEWER sits, and
# US long-form RPM runs ~10-20x India's. India-trending topics are also
# geo-locked — a US viewer will never be served a video about an IPL match —
# so the topic feed caps the audience before the algorithm ever gets a say.
#
# Shares state/seen.json with the daily news workflow, so the two can never
# cover the same story twice.

on:
  schedule:
    # Wed + Sat 17:50 UTC. Unlike the Shorts workflows the cron is NOT the publish
    # time here: the upload runs at the END of the job, and a long-form render takes
    # roughly 1-3 hours (16 images generated serially, then a 6-minute 1080p encode).
    # So 17:50 UTC lands the actual publish around 19:00-21:00 UTC = 15:00-17:00 US
    # Eastern, heading into the evening when long-form gets watched.
    # Re-time this if the render duration changes materially.
    # The :50 buys back the queue delay GitHub adds on the hour — see daily-video.yml.
    # It matters least here, since the render time dominates the publish slot anyway.
    - cron: "50 17 * * 3,6"
  workflow_dispatch:
    inputs:
      count:
        description: "How many long videos to generate"
        default: "1"
      privacy:
        description: "private | unlisted | public"
        default: "public"
      dry_run:
        description: "Generate but do not upload (true/false)"
        default: "false"

concurrency:
  group: weekly-longform
  cancel-in-progress: false

permissions:
  contents: write        # commit state/seen.json back after a run
  issues: write          # file a failure issue (see "Open an issue on failure")

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    # A long video is ~16 scene images (~13 min serial) plus a slower 1080p render,
    # so give it more room than the shorts workflows. 90 min was too tight once the
    # free-model LLM stages (which sleep 20s/60s between rate-limit sweeps) are added
    # on top, and a timeout kills the run after all the quota has already been spent.
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verify FFmpeg
        # After install: FFmpeg is no longer preinstalled on the runner, so the
        # pipeline uses imageio-ffmpeg's bundled binary. See daily-humor.yml.
        run: python -c "import sys; from app.media.video import _ffmpeg_exe; exe=_ffmpeg_exe(); print(exe or 'no ffmpeg found'); sys.exit(0 if exe else 1)"

      - name: Restore YouTube OAuth token
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
        run: |
          mkdir -p secrets
          printf '%s' "$YOUTUBE_TOKEN_JSON"          > secrets/youtube_token.json
          printf '%s' "$YOUTUBE_CLIENT_SECRET_JSON"  > secrets/youtube_client_secret.json
          python -c "import json;json.load(open('secrets/youtube_token.json'));print('token ok')"

      - name: Run long-form pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Long-form uses Gemini's free tier (run_daily selects it for --format
          # long when this key is set), keeping Shorts' OpenRouter budget intact.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: sqlite:///./run.db
          JWT_SECRET_KEY: ci-not-used
          TREND_PROVIDER: google_trends
          TREND_GEO: US
          TTS_PROVIDER: edge
          SUBTITLE_PROVIDER: edge
          IMAGE_PROVIDER: pollinations
          IMAGE_CONCURRENCY: "1"
          YOUTUBE_UPLOAD_PRIVACY: ${{ github.event.inputs.privacy || 'public' }}
          # 21:00 UTC = 17:00 ET / 14:00 PT on the Wed/Sat run days.
          # Long-form is the one stream where the render (1-3h) genuinely dominates,
          # so this slot is a ceiling rather than a precise target: a run that finishes
          # after 21:00 publishes immediately instead of waiting a week — see
          # youtube.next_publish_slot and YOUTUBE_PUBLISH_MAX_LEAD_HOURS.
          YOUTUBE_PUBLISH_SLOT: "21:00"
          MEDIA_ROOT: ./media_output
          LOG_LEVEL: INFO
          # Tracing is opt-in and self-arming: with no LANGSMITH_API_KEY secret set,
          # this resolves to false and the run behaves exactly as before. Traces carry
          # full prompts and scripts — keep the LangSmith project private.
          LANGSMITH_TRACING: ${{ secrets.LANGSMITH_API_KEY != '' }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: yt-automation
        run: |
          python scripts/run_daily.py \
            --format long \
            --count "${{ github.event.inputs.count || 1 }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Persist covered-story list + published ledger
        if: always()
        run: |
          if [[ -n "$(git status --porcelain state/)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "chore: record covered stories [skip ci]"
            git push
          else
            echo "no new stories to record"
          fi

      - name: Upload rendered video for review
        # A dry run renders the MP4 but never uploads it anywhere you can watch it.
        # Attaching it to the run is how you eyeball captions and motion before
        # anything reaches the channel.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: longform-video
          path: |
            media_output/**/video/*.mp4
            media_output/**/audio/*.srt
            media_output/**/video/*.ass
          retention-days: 7
          if-no-files-found: warn

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: longform-logs
          path: logs/
          retention-days: 7

      # Matters most here: long-form runs twice a week and has never yet completed, so
      # a silent failure could go unnoticed for days. See daily-video.yml.
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="${{ github.workflow }} failed"
          body="Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          The scheduled run did not complete, so nothing was published. Logs are
          attached to that run as an artifact."
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty') || true
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body" || echo "could not comment on issue #$existing"
          else
            gh issue create --title "$title" --body "$body" || echo "could not create issue — are Issues enabled on this repo?"
          fi
