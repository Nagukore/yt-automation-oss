name: Daily AI News Video

on:
  schedule:
    # 06:00 UTC daily (11:30 IST). GitHub may delay scheduled runs during peak load —
    # a late daily upload is harmless. Cron is UTC only; adjust for your audience.
    - cron: "0 6 * * *"
  workflow_dispatch:          # lets you trigger a run manually from the Actions tab
    inputs:
      count:
        description: "How many videos to generate"
        default: "1"
      privacy:
        description: "private | unlisted | public"
        default: "private"
      dry_run:
        description: "Generate but do not upload (true/false)"
        default: "false"

# Never let two runs generate videos at once — they'd race on topic selection
# and could double-post the same story.
concurrency:
  group: daily-video
  cancel-in-progress: false

permissions:
  contents: write              # needed to commit state/seen.json back after a run

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60        # a 2-video run takes ~20 min; this is a safety net

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify FFmpeg
        # Preinstalled on GitHub's Ubuntu runners; fail loudly if that ever changes.
        run: ffmpeg -version | head -1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Restore YouTube OAuth token
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
        run: |
          mkdir -p secrets
          printf '%s' "$YOUTUBE_TOKEN_JSON"          > secrets/youtube_token.json
          printf '%s' "$YOUTUBE_CLIENT_SECRET_JSON"  > secrets/youtube_client_secret.json
          python -c "import json;json.load(open('secrets/youtube_token.json'));print('token ok')"

      - name: Run daily pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Ephemeral SQLite is fine: durable dedupe lives in state/seen.json, which is
          # committed back after each run. No external database needed.
          DATABASE_URL: sqlite:///./run.db
          JWT_SECRET_KEY: ci-not-used
          TREND_PROVIDER: ai_news
          TTS_PROVIDER: edge
          SUBTITLE_PROVIDER: edge
          IMAGE_PROVIDER: pollinations
          IMAGE_CONCURRENCY: "1"
          YOUTUBE_UPLOAD_PRIVACY: ${{ github.event.inputs.privacy || 'private' }}
          MEDIA_ROOT: ./media_output
          LOG_LEVEL: INFO
        run: |
          python scripts/run_daily.py \
            --count "${{ github.event.inputs.count || 2 }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Persist covered-story list + published ledger
        # Runs even if generation failed, so a broken story isn't retried forever.
        if: always()
        run: |
          if [[ -n "$(git status --porcelain state/)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "chore: record covered stories [skip ci]"
            git push
          else
            echo "no new stories to record"
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs/
          retention-days: 7
