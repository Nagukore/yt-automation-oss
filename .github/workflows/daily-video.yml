name: Daily AI News Video

on:
  # --- SCHEDULES PAUSED ---------------------------------------------------
  # Cron triggers are commented out while this repo is public and idle, so no
  # scheduled runs burn Actions minutes or API quota. `workflow_dispatch`
  # below is left active: it only fires when someone clicks Run workflow.
  # To resume, uncomment the `schedule:` key and its `- cron:` line.
  # schedule:
  #   # 21:00 UTC starts the run; YOUTUBE_PUBLISH_SLOT below decides when the videos
  #   # actually go live, so this only needs to be far enough ahead to finish.
  #   #
  #   # The old comment here claimed the cron WAS the publish time. Measured over
  #   # 2026-08-05..19 it was not: the median news Short went live at 13:37 UTC off a
  #   # 12:50 cron, and heartbreak drifted +2h39m. The `:50` trick did not buy the
  #   # delay back. Uploads now carry status.publishAt, so GitHub can queue this run
  #   # whenever it likes and the video still surfaces at the same minute every day.
  #   #
  #   # Timing rationale: 12:50 UTC put the two daily news Shorts — half of all
  #   # output — at 19:07 IST, squarely in Indian prime time, and 09:37 ET, a dead
  #   # US slot. The 22:30 slot is 18:30 ET / 15:30 PT instead.
  #   - cron: "0 21 * * *"
  workflow_dispatch:          # lets you trigger a run manually from the Actions tab
    inputs:
      count:
        description: "How many videos to generate"
        default: "1"
      privacy:
        description: "private | unlisted | public"
        default: "public"
      dry_run:
        description: "Generate but do not upload (true/false)"
        default: "false"

# Never let two runs generate videos at once — they'd race on topic selection
# and could double-post the same story.
concurrency:
  group: daily-video
  cancel-in-progress: false

permissions:
  contents: write              # needed to commit state/seen.json back after a run
  issues: write                # file a failure issue (see "Open an issue on failure")

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60        # a 2-video run takes ~20 min; this is a safety net

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verify FFmpeg
        # After install: FFmpeg is no longer preinstalled on the runner, so the
        # pipeline uses imageio-ffmpeg's bundled binary. See daily-humor.yml.
        run: python -c "import sys; from app.media.video import _ffmpeg_exe; exe=_ffmpeg_exe(); print(exe or 'no ffmpeg found'); sys.exit(0 if exe else 1)"

      - name: Restore YouTube OAuth token
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
        run: |
          mkdir -p secrets
          printf '%s' "$YOUTUBE_TOKEN_JSON"          > secrets/youtube_token.json
          printf '%s' "$YOUTUBE_CLIENT_SECRET_JSON"  > secrets/youtube_client_secret.json
          python -c "import json;json.load(open('secrets/youtube_token.json'));print('token ok')"

      - name: Run daily pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Ephemeral SQLite is fine: durable dedupe lives in state/seen.json, which is
          # committed back after each run. No external database needed.
          DATABASE_URL: sqlite:///./run.db
          JWT_SECRET_KEY: ci-not-used
          TREND_PROVIDER: ai_news
          TTS_PROVIDER: edge
          SUBTITLE_PROVIDER: edge
          IMAGE_PROVIDER: pollinations
          IMAGE_CONCURRENCY: "1"
          YOUTUBE_UPLOAD_PRIVACY: ${{ github.event.inputs.privacy || 'public' }}
          # Exact UTC go-live time. The run uploads private with status.publishAt and
          # YouTube flips it public here. 22:30 UTC = 18:30 ET / 15:30 PT. The second
          # video of the run is staggered +15 min so the two don't compete.
          # A manual dispatch with privacy != public skips scheduling entirely.
          YOUTUBE_PUBLISH_SLOT: "22:30"
          MEDIA_ROOT: ./media_output
          LOG_LEVEL: INFO
          # Tracing is opt-in and self-arming: with no LANGSMITH_API_KEY secret set,
          # this resolves to false and the run behaves exactly as before. Traces carry
          # full prompts and scripts — keep the LangSmith project private.
          LANGSMITH_TRACING: ${{ secrets.LANGSMITH_API_KEY != '' }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: yt-automation
        run: |
          python scripts/run_daily.py \
            --count "${{ github.event.inputs.count || 2 }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Persist covered-story list + published ledger
        # Runs even if generation failed, so a broken story isn't retried forever.
        if: always()
        run: |
          if [[ -n "$(git status --porcelain state/)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "chore: record covered stories [skip ci]"
            git push
          else
            echo "no new stories to record"
          fi

      - name: Upload rendered video for review
        # A dry run renders the MP4 but never uploads it anywhere you can watch it.
        # Attaching it to the run is how you eyeball captions and motion before
        # anything reaches the channel.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-video
          path: |
            media_output/**/video/*.mp4
            media_output/**/audio/*.srt
            media_output/**/video/*.ass
          retention-days: 7
          if-no-files-found: warn

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs/
          retention-days: 7

      # Uploads publish public with no manual review step, so a failed run is otherwise
      # completely silent: no video, no error, nothing until someone opens the Actions
      # tab. Filing an issue reuses GitHub's own email/mobile notifications and needs no
      # Slack or webhook secret. Repeat failures comment on the existing open issue
      # rather than filing a new one every day; closing it resets that.
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="${{ github.workflow }} failed"
          body="Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          The scheduled run did not complete, so nothing was published. Logs are
          attached to that run as an artifact."
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty') || true
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body" || echo "could not comment on issue #$existing"
          else
            gh issue create --title "$title" --body "$body" || echo "could not create issue — are Issues enabled on this repo?"
          fi
