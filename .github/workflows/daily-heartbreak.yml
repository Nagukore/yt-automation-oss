name: Daily Code Heartbreak Video

# Third content stream: sad one-sided-love coding quotes (codemetaphor style).
# Separate workflow so it keeps its own schedule and dedupe history
# (state/seen_code_heartbreak.json). Shares secrets and the YouTube channel.

on:
  # --- SCHEDULES PAUSED ---------------------------------------------------
  # Cron triggers are commented out while this repo is public and idle, so no
  # scheduled runs burn Actions minutes or API quota. `workflow_dispatch`
  # below is left active: it only fires when someone clicks Run workflow.
  # To resume, uncomment the `schedule:` key and its `- cron:` line.
  # schedule:
  #   # 00:30 UTC starts the run; YOUTUBE_PUBLISH_SLOT decides when it goes live
  #   # (02:00 UTC = 22:00 ET / 19:00 PT, previous calendar day in the US). Late
  #   # evening is when sad-quote reels actually land.
  #   # This stream had the worst drift of all under the old scheme: a 00:50 cron was
  #   # publishing at 03:29 UTC median, +2h39m. See daily-video.yml.
  #   # Total is still 4 uploads/day (2 news + 1 humor + 1 heartbreak) against the
  #   # ~6/day YouTube quota, and the run stays clear of the 21:00 news and 23:00
  #   # humor jobs.
  #   - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "How many heartbreak videos to generate"
        default: "1"
      privacy:
        description: "private | unlisted | public"
        default: "public"
      dry_run:
        description: "Generate but do not upload (true/false)"
        default: "false"

concurrency:
  group: daily-heartbreak
  cancel-in-progress: false

permissions:
  contents: write        # commit state/seen_code_heartbreak.json back after a run
  issues: write          # file a failure issue (see "Open an issue on failure")

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verify FFmpeg
        # After install: FFmpeg is no longer preinstalled on the runner, so the
        # pipeline uses imageio-ffmpeg's bundled binary. See daily-humor.yml.
        run: python -c "import sys; from app.media.video import _ffmpeg_exe; exe=_ffmpeg_exe(); print(exe or 'no ffmpeg found'); sys.exit(0 if exe else 1)"

      - name: Restore YouTube OAuth token
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
        run: |
          mkdir -p secrets
          printf '%s' "$YOUTUBE_TOKEN_JSON"          > secrets/youtube_token.json
          printf '%s' "$YOUTUBE_CLIENT_SECRET_JSON"  > secrets/youtube_client_secret.json
          python -c "import json;json.load(open('secrets/youtube_token.json'));print('token ok')"

      - name: Run heartbreak pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DATABASE_URL: sqlite:///./run.db
          JWT_SECRET_KEY: ci-not-used
          TTS_PROVIDER: edge
          SUBTITLE_PROVIDER: edge
          IMAGE_PROVIDER: pollinations
          IMAGE_CONCURRENCY: "1"
          # Softer and slower than the humor voice — these are quiet, aching
          # quotes, not comedy; the pause between sentences is part of the mood.
          # Must be a voice edge-tts actually serves (scripts/list_voices.py);
          # an unknown name fails with NoAudioReceived.
          EDGE_TTS_VOICE: en-US-BrianNeural
          EDGE_TTS_RATE: "-12%"
          YOUTUBE_UPLOAD_PRIVACY: ${{ github.event.inputs.privacy || 'public' }}
          # 02:00 UTC = 22:00 ET / 19:00 PT. See daily-video.yml.
          YOUTUBE_PUBLISH_SLOT: "02:00"
          MEDIA_ROOT: ./media_output
          LOG_LEVEL: INFO
          # Tracing is opt-in and self-arming: with no LANGSMITH_API_KEY secret set,
          # this resolves to false and the run behaves exactly as before. Traces carry
          # full prompts and scripts — keep the LangSmith project private.
          LANGSMITH_TRACING: ${{ secrets.LANGSMITH_API_KEY != '' }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: yt-automation
        run: |
          python scripts/run_daily.py \
            --content-type code_heartbreak \
            --count "${{ github.event.inputs.count || 1 }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Persist covered-theme list + published ledger
        if: always()
        run: |
          if [[ -n "$(git status --porcelain state/)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "chore: record heartbreak themes [skip ci]"
            git push
          else
            echo "no new themes to record"
          fi

      - name: Upload rendered video for review
        # A dry run renders the MP4 but never uploads it anywhere you can watch it.
        # Attaching it to the run is how you eyeball captions and motion before
        # anything reaches the channel.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heartbreak-video
          path: |
            media_output/**/video/*.mp4
            media_output/**/audio/*.srt
            media_output/**/video/*.ass
          retention-days: 7
          if-no-files-found: warn

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: heartbreak-logs
          path: logs/
          retention-days: 7

      # See daily-video.yml for why: public auto-publish means a failed run is silent.
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="${{ github.workflow }} failed"
          body="Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          The scheduled run did not complete, so nothing was published. Logs are
          attached to that run as an artifact."
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty') || true
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body" || echo "could not comment on issue #$existing"
          else
            gh issue create --title "$title" --body "$body" || echo "could not create issue — are Issues enabled on this repo?"
          fi
