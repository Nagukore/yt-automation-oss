name: Daily Dev Humor Video

# Separate from the AI-news workflow so the two content streams have independent
# schedules and dedupe history (state/seen_dev_humor.json vs state/seen.json).
# Shares the same secrets and YouTube channel unless you point it at another one.

on:
  schedule:
    # 15:00 UTC daily (offset from the 06:00 news run so uploads don't collide
    # and you don't blow the ~6/day YouTube quota with both at once).
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "How many humor videos to generate"
        default: "1"
      privacy:
        description: "private | unlisted | public"
        default: "private"
      dry_run:
        description: "Generate but do not upload (true/false)"
        default: "false"

concurrency:
  group: daily-humor
  cancel-in-progress: false

permissions:
  contents: write        # commit state/seen_dev_humor.json back after a run

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify FFmpeg
        run: ffmpeg -version | head -1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Restore YouTube OAuth token
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
        run: |
          mkdir -p secrets
          printf '%s' "$YOUTUBE_TOKEN_JSON"          > secrets/youtube_token.json
          printf '%s' "$YOUTUBE_CLIENT_SECRET_JSON"  > secrets/youtube_client_secret.json
          python -c "import json;json.load(open('secrets/youtube_token.json'));print('token ok')"

      - name: Run humor pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DATABASE_URL: sqlite:///./run.db
          JWT_SECRET_KEY: ci-not-used
          TTS_PROVIDER: edge
          SUBTITLE_PROVIDER: edge
          IMAGE_PROVIDER: pollinations
          IMAGE_CONCURRENCY: "1"
          # A slower, warmer voice suits the melancholy tone better than the news voice.
          EDGE_TTS_VOICE: en-US-GuyNeural
          EDGE_TTS_RATE: "-8%"
          YOUTUBE_UPLOAD_PRIVACY: ${{ github.event.inputs.privacy || 'private' }}
          MEDIA_ROOT: ./media_output
          LOG_LEVEL: INFO
        run: |
          python scripts/run_daily.py \
            --content-type dev_humor \
            --count "${{ github.event.inputs.count || 1 }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Persist covered-theme list + published ledger
        if: always()
        run: |
          if [[ -n "$(git status --porcelain state/)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "chore: record humor themes [skip ci]"
            git push
          else
            echo "no new themes to record"
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: humor-logs
          path: logs/
          retention-days: 7
